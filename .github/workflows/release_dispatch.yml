name: MODFLOW 6 release dispatch
on:
  push:
    branches:
      # initial phase of the release procedure is triggered by pushing a release branch, for
      # a patch release (patch version 1-9, then anything) or a release candidate (ending in
      # rc). A new minor release, vX.Y.0, needs its DOI as input so is started via dispatch.
      - v[0-9]+.[0-9]+.[1-9]*
      - v[0-9]+.[0-9]+.[0-9]+rc*
      # intermediate phase is triggered by merging the release branch to master
      - master
  # final phase is triggered by promoting/publishing a GitHub release draft to a full release
  release:
    types:
      - published
  # workflow_dispatch trigger to start release via GitHub UI or CLI,
  # as an alternative to triggering when a release branch is pushed.
  # see https://docs.github.com/en/actions/managing-workflow-runs/manually-running-a-workflow
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to release from.'
        required: true
        type: string
      compiler_toolchain:
        description: 'Compiler toolchain to use. For supported options see https://github.com/MODFLOW-ORG/modflow6/blob/develop/DEVELOPER.md#compiler-compatibility.'
        required: false
        type: string
        default: 'intel-classic'
      compiler_version:
        description: 'Compiler version to use. For supported options see https://github.com/MODFLOW-ORG/modflow6/blob/develop/DEVELOPER.md#compiler-compatibility.'
        required: false
        type: string
        default: '2021.6'
      releasemode:
        description: 'Build a full distribution containing sources, examples, and all documentation. If false, the distribution contains only binaries, mf6io, release notes, and code.json, with binaries built in develop mode, and disclaimers & version strings indicating preliminary/provisional status. If true, a full distribution is created, with binaries built in release mode, and disclaimer language indicating review and approval.'
        required: false
        type: boolean
        default: false
      run_tests:
        description: 'Run tests after building binaries.'
        required: false
        type: boolean
        default: true
      version:
        description: 'Version number to use for release.'
        required: true
        type: string
      patch:
        description: 'Create a patch release. If true, only bug fixes and new examples will be included in generated documentation.'
        required: false
        type: boolean
        default: false
      doi:
        description: 'DOI link of the release, e.g. https://doi.org/10.5066/P1PGE9XW, for the release history in the release notes. Required for a new minor or major release unless its release history row was already added to the release branch. Patch releases reuse the DOI of the previous release with the same major and minor version.'
        required: false
        type: string
jobs:
  set_options:
    name: Set release options
    if: github.event_name != 'release' && github.ref_name != 'master'
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash -l {0}
    outputs:
      branch: ${{ steps.set_branch.outputs.branch }}
      compiler_toolchain: ${{ steps.set_compiler.outputs.compiler_toolchain }}
      compiler_version: ${{ steps.set_compiler.outputs.compiler_version }}
      version: ${{ steps.set_version.outputs.version }}
      patch: ${{ steps.set_patch.outputs.patch }}
      date: ${{ steps.set_date.outputs.date }}
    steps:
      - name: Checkout modflow6
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/modflow6
          ref: ${{ github.ref }}
      - name: Set branch
        id: set_branch
        run: |
          # if branch was provided explicitly via workflow_dispatch, use it
          if [[ ("${{ github.event_name }}" == "workflow_dispatch") && (-n "${{ inputs.branch }}") ]]; then
            branch="${{ inputs.branch }}"
            # prevent releases from master
            if [[ "$branch" == "master" ]]; then
              echo "error: releases may not be triggered from branch $branch"
              exit 1
            fi
            echo "using branch $branch from workflow_dispatch"
          elif [[ ("${{ github.event_name }}" == "push") && ("${{ github.ref_name }}" != "master") ]]; then
            # if release was triggered by pushing a release branch, use that branch
            branch="${{ github.ref_name }}"
            echo "using branch $branch from ref ${{ github.ref }}"
          else
            # otherwise exit with an error
            echo "error: this workflow should not have triggered for event ${{ github.event_name }} on branch ${{ github.ref_name }}"
            exit 1
          fi
          echo "branch=$branch" >> $GITHUB_OUTPUT
      - name: Set compiler
        id: set_compiler
        run: |
          # if compiler toolchain was provided explicitly via workflow_dispatch, use it
          if [[ ("${{ github.event_name }}" == "workflow_dispatch") && (-n "${{ inputs.compiler_toolchain }}") ]]; then
            compiler_toolchain="${{ inputs.compiler_toolchain }}"
            compiler_version="${{ inputs.compiler_version }}"
            echo "using compiler toolchain $compiler_toolchain version $compiler_version from workflow_dispatch"
          elif [[ ("${{ github.event_name }}" == "push") && ("${{ github.ref_name }}" != "master") ]]; then
            # if release was triggered by pushing a release branch, use the default toolchain and version
            compiler_toolchain="intel-classic"
            compiler_version="2021.6"
            echo "using default compiler toolchain $compiler_toolchain version $compiler_version"
          else
            # otherwise exit with an error
            echo "error: this workflow should not have triggered for event ${{ github.event_name }} on branch ${{ github.ref_name }}"
            exit 1
          fi
          echo "compiler_toolchain=$compiler_toolchain" >> $GITHUB_OUTPUT
          echo "compiler_version=$compiler_version" >> $GITHUB_OUTPUT
      - name: Set version
        id: set_version
        run: |
          # if version number was provided explicitly via workflow_dispatch, use it
          if [[ ("${{ github.event_name }}" == "workflow_dispatch") && (-n "${{ inputs.version }}") ]]; then
            ver="${{ inputs.version }}"
            echo "using version number $ver from workflow_dispatch"
          elif [[ ("${{ github.event_name }}" == "push") && ("${{ github.ref_name }}" != "master") ]]; then
            # if release was triggered by pushing a release branch, parse version number from branch name (sans leading 'v')
            ref="${{ github.ref_name }}"
            ver="${ref#"v"}"
            echo "parsed version number $ver from branch name $ref"
          else
            # otherwise exit with an error
            echo "error: version number not provided explicitly (via workflow_dispatch input) or implicitly (via branch name)"
            exit 1
          fi
          echo "version=$ver" >> $GITHUB_OUTPUT
      - name: Set patch
        id: set_patch
        run: |
          # if patch was provided explicitly via workflow_dispatch, use it
          if [[ ("${{ github.event_name }}" == "workflow_dispatch") && (-n "${{ inputs.patch }}") ]]; then
            patch="${{ inputs.patch }}"
            echo "using patch setting $patch from workflow_dispatch"
          elif [[ ("${{ github.event_name }}" == "push") && ("${{ github.ref_name }}" != "master") ]]; then
            # if release was triggered by pushing a release branch, check the version against the latest
            # tag on master to determine if this is a patch release
            latest_tag=$(git ls-remote --tags origin "6.*" | awk -F/ '{print $3}' | sort -V | tail -n1)
            echo "latest version on master is $latest_tag"
            IFS='.' read -r -a latest_parts <<< "$latest_tag"
            IFS='.' read -r -a new_parts <<< "${{ steps.set_version.outputs.version }}"
            if [[ ${#latest_parts[@]} -ne 3 || ${#new_parts[@]} -ne 3 ]]; then
              echo "error: version number is not in major.minor.patch format"
              exit 1
            fi
            if [[ ${latest_parts[0]} -ne ${new_parts[0]} || ${latest_parts[1]} -ne ${new_parts[1]} ]]; then
              patch="false"
              echo "major or minor version has changed, not a patch release"
            elif [[ ${latest_parts[2]} -lt ${new_parts[2]} ]]; then
              patch="true"
              echo "patch version has changed, this is a patch release"
            fi
          else
            # otherwise exit with an error
            echo "error: this workflow should not have triggered for event ${{ github.event_name }} on branch ${{ github.ref_name }}"
            exit 1
          fi
          echo "patch=$patch" >> $GITHUB_OUTPUT
      - name: Set date
        id: set_date
        run: |
          # one date for all jobs, so timestamps and the release history agree
          echo "date=$(date -u +%F)" >> $GITHUB_OUTPUT
      - name: Check release history
        env:
          BRANCH: ${{ steps.set_branch.outputs.branch }}
          VERSION: ${{ steps.set_version.outputs.version }}
          DOI: ${{ inputs.doi }}
        run: |
          # The release history in the release notes gets a row for the release during the build.
          # It reuses the DOI of the previous release with the same major and minor version, so
          # patch releases need no DOI, but a new minor release needs one: either from the doi
          # input, or from a row already on the release branch. Fail now instead of in the build
          # if there isn't one. Release candidates get no row.
          git fetch --depth=1 origin "$BRANCH"
          git show FETCH_HEAD:doc/ReleaseNotes/ReleaseNotes.tex > "$RUNNER_TEMP/ReleaseNotes.tex"
          args=(-v "$VERSION" --check --notes "$RUNNER_TEMP/ReleaseNotes.tex")
          if [[ -n "$DOI" ]]; then
            args+=(--doi "$DOI")
          fi
          if ! python3 doc/ReleaseNotes/release_history.py "${args[@]}"; then
            echo "Start the release with workflow_dispatch and provide the doi input, or add a row"
            echo "for $VERSION to the release history in doc/ReleaseNotes/ReleaseNotes.tex on $BRANCH."
            exit 1
          fi
  prepare:
    name: Prepare release
    # skipped for rc/dry runs: they're never merged to master, so there's no
    # need to pin the build to a single prepared commit. build/docs/dist keep
    # applying update_version themselves for these, as they do today.
    if: ${{ github.ref_name != 'master' && ((github.event_name == 'workflow_dispatch' && inputs.releasemode == true) || (github.event_name != 'workflow_dispatch' && !contains(github.ref_name, 'rc'))) }}
    needs: set_options
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    defaults:
      run:
        shell: bash -l {0}
    outputs:
      sha: ${{ steps.prepare.outputs.sha }}
    steps:
      - name: Checkout modflow6
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/modflow6
          ref: ${{ needs.set_options.outputs.branch }}

      - name: Setup Micromamba
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
          cache-downloads: true
          cache-environment: true

      - name: Update version and release history
        id: prepare
        working-directory: distribution
        env:
          # empty if workflow was triggered by pushing a release branch
          DOI: ${{ inputs.doi }}
          DATE: ${{ needs.set_options.outputs.date }}
        run: |
          ver="${{ needs.set_options.outputs.version }}"

          # if the branch tip is already a prepare commit for this version (a retry
          # of a previously prepared release, e.g. after a failed build), reuse its
          # date so the regenerated files match and no new commit is needed below --
          # avoids piling up a bot commit per retry in master's history once merged
          date="$DATE"
          if git log -1 --format=%s | grep -qF "ci(release): update version to $ver"; then
            date=$(git log -1 --format=%cd --date=format:%F)
            echo "reusing date $date from the existing prepare commit for $ver"
          fi

          # update version files
          args=(-v "$ver" --date "$date")
          # approve will be empty if workflow was triggered by pushing a release branch
          if [[ ("${{ inputs.releasemode }}" == "true") || ("${{ inputs.releasemode }}" == "") ]]; then
            args+=(--releasemode)
          fi
          python update_version.py "${args[@]}"

          # add the release to the release history, using the DOI if provided
          args=(-v "$ver" --date "$date")
          if [[ -n "$DOI" ]]; then
            args+=(--doi "$DOI")
          fi
          python ../doc/ReleaseNotes/release_history.py "${args[@]}"

          # lint version.f90
          fprettify -c ../.fprettify.yaml ../src/Utilities/version.f90

          git config core.sharedRepository true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          # doc/version.py always changes (it embeds the exact run time, down to
          # the second, in a comment), so ignore it when deciding whether there's
          # anything real to commit
          if git diff --cached --quiet -- . ':(exclude)doc/version.py'; then
            echo "no real changes since the last prepare commit for $ver, reusing it"
          else
            git commit -m "ci(release): update version to $ver"
            git push origin "HEAD:refs/heads/${{ needs.set_options.outputs.branch }}"
          fi

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  make_dist:
    name: Make distribution
    uses: MODFLOW-ORG/modflow6/.github/workflows/release.yml@develop
    needs:
      - set_options
      - prepare
    # prepare is skipped (not failed) for rc/dry runs, so tolerate that explicitly
    if: |
      always() &&
      needs.set_options.result == 'success' &&
      (needs.prepare.result == 'success' || needs.prepare.result == 'skipped')
    with:
      # If the workflow is manually triggered, the maintainer must manually set approve=true to approve a release.
      # If triggered by pushing a release branch, the release is approved if the branch name doesn't contain "rc".
      compiler_toolchain: ${{ needs.set_options.outputs.compiler_toolchain }}
      compiler_version: ${{ needs.set_options.outputs.compiler_version }}
      # the SHA prepare committed to, when it ran; otherwise (rc/dry run) the release
      # branch itself, since each job applies update_version on its own in that case
      branch: ${{ needs.prepare.outputs.sha || needs.set_options.outputs.branch }}
      # If the workflow is manually triggered, the maintainer must manually set releasemode to true, otherwise the default is false.
      # If triggered by pushing a release branch, the release is developmode if the branch name contains "rc", otherwise releasemode.
      releasemode: ${{ (github.event_name == 'workflow_dispatch' && inputs.releasemode == true) || github.event_name != 'workflow_dispatch' }}
      # If the workflow is manually triggered, the maintainer must manually set run_tests to false, otherwise the default is true.
      # If triggered by pushing a release branch, tests are enabled.
      run_tests: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_tests == true) || github.event_name != 'workflow_dispatch' }}
      version: ${{ needs.set_options.outputs.version }}
      patch: ${{ (github.event_name == 'workflow_dispatch' && inputs.patch == true) || (github.event_name != 'workflow_dispatch' && needs.set_options.outputs.patch == 'true') }}
      # false when prepare already committed version metadata; true (rc/dry run) when
      # each build/docs/dist job still needs to apply it itself
      update_version: ${{ needs.prepare.result != 'success' }}
      # the same date for all jobs, so timestamps agree. only used when update_version is true
      date: ${{ needs.set_options.outputs.date }}
  pr:
    name: Draft release PR
    if: ${{ github.ref_name != 'master' && ((github.event_name == 'workflow_dispatch' && inputs.releasemode == true) || (github.event_name != 'workflow_dispatch' && !contains(github.ref_name, 'rc'))) }}
    needs:
      - set_options
      - make_dist
    runs-on: ubuntu-22.04
    permissions:
      pull-requests: write
    steps:
      - name: Create pull request
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ver="${{ needs.set_options.outputs.version }}"
          body='
          # MODFLOW '$ver' release

          The release can be approved by merging this PR into `master`. Merging rather than squashing is necessary to preserve the commit history.

          When this PR is merged, a final job will be triggered to draft a tagged GitHub release, then upload assets (OS distributions and release notes).
          '
          gh pr create -B "master" -H "${{ needs.set_options.outputs.branch }}" -R "${{ github.repository }}" --title "Release $ver" --draft --body "$body"

  release:
    name: Draft release
    # runs only after release PR is merged to master
    if: github.event_name == 'push' && github.ref_name == 'master'
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - name: Checkout modflow6
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/modflow6
          path: modflow6

      - name: Setup Micromamba
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: modflow6/environment.yml
          cache-downloads: true
          cache-environment: true

      - name: Download artifacts
        uses: dawidd6/action-download-artifact@v24

      - name: Draft release
        working-directory: modflow6
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # create draft release
          version=$(python distribution/update_version.py -g)
          title="MODFLOW $version"
          citation=$(python distribution/update_version.py -c)
          notes='
          This is the approved USGS MODFLOW '$version' release.
      
          '$citation'
      
          Visit the USGS "MODFLOW and Related Programs" site for information on MODFLOW 6 and related software: https://doi.org/10.5066/F76Q1VQV
          '
          gh release create "$version" ../mf*/mf*.zip ../release_notes/release.pdf --target master --title "$title" --notes "$notes" --draft --latest

  reset:
    name: Reset develop
    # runs after a release is published. opens a PR to merge master back
    # into develop with the version string updated for the next cycle
    if: github.event_name == 'release'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - name: Checkout modflow6
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/modflow6
          ref: master
          fetch-depth: 0

      - name: Setup Micromamba
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
          cache-downloads: true
          cache-environment: true

      - name: Archive release notes
        working-directory: doc/ReleaseNotes
        run: |
          # the released version, since we branched from master (and this runs
          # before the version bump below)
          ver=$(cat ../../version.txt)

          # a non-zero patch number means a patch release: archive and clear
          # only the fix and example items, the rest carry to the next minor release
          patch=""
          [ "$(echo "$ver" | cut -d. -f3)" != "0" ] && patch="--patch"

          # archive this version's notes to previous/v$ver.tex, register them
          # in appendixA.tex, and clear the archived items from develop.toml
          python reset_releasenotes.py $patch

      - name: Update version and open PR
        working-directory: distribution
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # the released version, since we branched from master
          ver=$(cat ../version.txt)
          branch="post-release-$ver-reset"

          # bump minor and add '.dev0' suffix
          next=$(python update_version.py --post-release)

          # lint the generated source
          fprettify -c ../.fprettify.yaml ../src/Utilities/version.f90

          # commit and push
          git config core.sharedRepository true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -A
          git commit -m "ci(release): update version to $next, archive release notes"
          git push origin "$branch"

          # create PR
          body='
          # Reset `develop` after release '$ver'

          Merge (do not squash) this pull request to bring `master` back into `develop`,
          set the development version to `'$next'`, and archive the `'$ver'` release notes.
          '
          gh pr create -B "develop" -H "$branch" --title "Post release $ver reset" --body "$body"
