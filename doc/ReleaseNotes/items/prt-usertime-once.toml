section = "fixes"
subsection = "model"
description = "The PRT Model could report a user tracking time twice for the same particle when the time coincided with a cell exit, including the immediate exit of a particle released on a cell face, or with the end of a time step. With DRY_TRACKING_METHOD STAY, a particle entering a dry cell partway through a time step could also report earlier tracking times again. Each tracking time is now reported once per particle, at the earliest opportunity. Other events at the same time, such as the release or the exit, are still reported."
