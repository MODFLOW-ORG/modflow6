section = "fixes"
subsection = "model"
description = "The PRT Model could report a user tracking time twice for the same particle when the time coincided with the particle's release, a cell or subcell exit, or the end of a time step, once on each side of the boundary. Each tracking time is now reported at most once per particle, at the earliest opportunity, for example in the cell the particle is leaving. Other events at the same time, such as the release or the exit, are still reported. Track output may be shorter where duplicate records were previously written."
