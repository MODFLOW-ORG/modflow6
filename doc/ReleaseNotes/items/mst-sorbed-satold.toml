section = "fixes"
subsection = "model"
description = "The MST Package scaled the sorbed mass released when a cell drained by the specific yield instead of by the change in the water table, so solute was lost or gained without appearing in the budget. The saturation of each cell at the end of the previous time step is now stored, so results change for transport models with sorption in cells whose water table moves. When flows are read from files, the saturation before the first time step is still estimated from the specific yield storage flow."
