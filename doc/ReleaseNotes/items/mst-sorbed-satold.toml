section = "fixes"
subsection = "model"
description = "The sorbed mass in a cell whose water table moved was calculated by the MST Package from a saturation for the previous time step that was reconstructed from the specific yield storage flow without dividing by the porosity. The sorbed mass released when a cell drained was therefore scaled by the specific yield rather than by the change in the water table, and solute was lost or gained without appearing in the budget. The saturation at the end of the previous time step is now stored, and the results of transport models with sorption in cells whose water table moves will differ from previous versions. When flows are read from files, the saturation before the first time step is reconstructed from the specific yield storage flow and the porosity."
