section = "features"
subsection = "advanced"
description = "Added a new CONNECTION\\_STATUS option to the PERIOD block of the Multi-Aquifer Well (MAW) Package that activates or deactivates an individual well-aquifer connection during a simulation. The option makes it possible to simulate a well that is backplugged or deepened while the simulation is running; connection data is specified once for the maximum extent of the well, and a connection that represents a part of the well that is sealed off or has not yet been drilled is given a status of INACTIVE. An inactive connection does not exchange water with its groundwater cell and is written to the multi-aquifer well budget file with a flow rate of zero. MAW and CONDUCTANCE observations of an inactive connection are reported as DNODATA (3.0E+30), as they are for an inactive well. A connection that is not simulated, because it or its well is inactive, has no wetted area, so the Multi-Aquifer Well Energy Transport (MWE) Package does not conduct heat through it; previously an inactive well continued to conduct heat through its connections. A connection is simulated only if both the well and the connection are active, so setting the well status to INACTIVE suspends all of its connections without changing their individual settings, and the previously specified connection settings are used again when the well is made ACTIVE or CONSTANT. At least one connection of a well must be active; setting every connection of a well to INACTIVE is an error; set the well STATUS to INACTIVE instead. A new BOTTOM option has also been added to the PERIOD block, which changes the bottom elevation of a multi-aquifer well so that a well that has been filled stops yielding water at the elevation of the fill."
