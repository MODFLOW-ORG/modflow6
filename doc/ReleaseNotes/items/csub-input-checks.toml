section = "fixes"
subsection = "internal"
description = "The Skeletal Storage, Compaction, and Subsidence (CSUB) Package now reports an input error for a negative CG\\_SKE\\_CR, a CG\\_THETA less than 0 or greater than or equal to 1, or an interbed THETA equal to 1; a negative CG\\_SKE\\_CR and a CG\\_THETA greater than 1 were previously accepted or not reported, and a porosity of 1 caused a division by zero for non-head-based formulations. The Time-Varying Storage (TVS) Package could set specific storage (SS) to a non-zero value in a model with CSUB, which requires SS to be zero, so that storage was counted by both the Storage (STO) and CSUB Packages; this is now also an input error."
