section = "features"
subsection = "exchanges"
description = "The IDOMAIN of a GWT or GWE model can now exclude cells that are active in the GWF model that supplies its flows, including with GWT-GWT and GWE-GWE exchanges and in parallel. Water that crosses the boundary of the reduced domain enters or leaves at the concentration or temperature of the cell and is reported as DOMAIN-BOUNDARY in the model budget. An advanced transport package cannot be connected to an excluded cell."
