section = "fixes"
subsection = "internal"
description = "When the Viscosity (VSC) Package was active, hydraulic conductivity changes made by the Time-Varying Hydraulic Conductivity (TVK) Package were discarded each time step, because VSC applied the viscosity ratio to the hydraulic conductivity originally specified in the NPF Package. VSC now applies the viscosity ratio to the hydraulic conductivity including TVK changes."
