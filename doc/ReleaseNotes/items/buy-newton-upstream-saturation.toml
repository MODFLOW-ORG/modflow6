section = "fixes"
subsection = "model"
description = "With the Newton formulation, the Buoyancy (BUY) Package scaled the conductance of a horizontal connection by the saturation of the cell with the higher head. Because the buoyancy flow between cells of different density is generally not zero when the two cell heads are equal, the flow could jump when the ordering of two nearly equal heads changed between iterations, and a dry or partially saturated cell next to a cell of different density could flip between two states without converging, within a model or across a GWF-GWF exchange. The upstream cell is now selected from the direction of the total (head plus buoyancy) flow, and the Newton terms include the derivative of the buoyancy flow with respect to the upstream saturation. The BUY Package now also uses the cell saturations adjusted by the NPF HIGHEST\\_CELL\\_SATURATION option. Heads computed with the Newton formulation and the BUY Package may change slightly. Results are unchanged without the Newton formulation or when all densities equal the reference density."
