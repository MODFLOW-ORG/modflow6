section = "features"
subsection = "model"
description = "With stranded mass, the water volume of a cell includes the water in compressible storage of the Storage (STO) Package, so results change for a model with specific storage. The new SAVE\\_STORAGE\\_VOLUME option of the STO Package saves that volume and the saturation at the start of each time step to the budget file, so a transport model that reads its flows from the file gives the same results as one solved with the flow model."
