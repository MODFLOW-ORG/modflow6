section = "fixes"
subsection = "basic"
description = "The Unsaturated Zone Flow (UZF) Package unsaturated-zone state is registered with the memory manager, and is therefore visible through the BMI and XMI interfaces, under names inherited from MODFLOW-2005 that did not describe their contents. The wave arrays UZDPST, UZTHST, UZFLST, UZSPST, and NWAVST are now WAVE\\_DEPTH, WAVE\\_THETA, WAVE\\_FLUX, WAVE\\_SPEED, and NWAVES, and the cell properties THTR, THTS, THTI, EXTWC, EPS, HA, HROOT, and ROOTACT are now THETA\\_RES, THETA\\_SAT, THETA\\_INIT, THETA\\_EXT, BC\\_EPS, AIR\\_ENTRY, ROOT\\_POT, and ROOT\\_ACT. Other UZF variables are renamed on the same principle. The previous names are checked in to the memory manager as aliases of the renamed variables, so a program that reads UZF variables by name through the BMI or XMI interface continues to resolve either name. The exceptions are NWAV and NTRAIL, which changed from arrays with one value per UZF cell to scalars and could not be aliased, and the stress period values previously registered as SINF\\_PVAR, PET\\_PVAR, EXDP\\_PVAR, EXTWC\\_PVAR, HA\\_PVAR, HROOT\\_PVAR, and ROOTACT\\_PVAR, which are now held with the package input under the names FINF, PET, EXTDP, EXTWC, HA, HROOT, and ROOTACT. Input files, keywords, and simulated results are unaffected."
