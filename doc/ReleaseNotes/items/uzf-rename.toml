section = "fixes"
subsection = "basic"
description = "The wave states within the Unsaturated Zone Flow (UZF) Package are registered with the memory manager and are therefore visible through the BMI and XMI interfaces, under names inherited from MODFLOW-2005 that vaguely described their contents. The wave arrays UZDPST, UZTHST, UZFLST, UZSPST, and NWAVST are now WAVE\\_DEPTH, WAVE\\_THETA, WAVE\\_FLUX, WAVE\\_SPEED, and NWAVES, and the cell properties THTR, THTS, THTI, EXTWC, EPS, HA, HROOT, and ROOTACT are now THETA\\_RES, THETA\\_SAT, THETA\\_INIT, THETA\\_EXT, BC\\_EPS, AIR\\_ENTRY, ROOT\\_POT, and ROOT\\_ACT. Other UZF variables are renamed on the same principle. The previous names are checked in to the memory manager as aliases, so a program that reads UZF variables by name through the BMI or XMI interface continues to resolve either name, but each previous name that is used is reported once as deprecated in the warning report of the simulation listing file. The exceptions are NWAV and NTRAIL, which changed from arrays with one value per UZF cell to scalars and could not be aliased. Input files, keywords, and simulated results are unaffected."
