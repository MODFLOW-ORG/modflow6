section = "fixes"
subsection = "solution"
description = "With SCALING_METHOD DIAGONAL or L2NORM, the IMS inner convergence test compared INNER_DVCLOSE and INNER_RCLOSE with scaled values for CG, with the wrong scaling factor for the BICGSTAB head change with L2NORM scaling, and with another cell's scaling factor when the matrix was also reordered. The head change and residual are now returned to model units in all of these cases, which can change the number of inner iterations for simulations that use matrix scaling. Simulations without matrix scaling are not affected."
