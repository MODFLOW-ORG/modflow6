section = "fixes"
subsection = "model"
description = "An observation that named a boundary without the BOUNDNAMES option read out of bounds. List-based and array-based packages gave no error and wrote the no-data value. This is now an error. An observation that named a nonexistent boundary is now also an error in CSUB and UZF, with or without BOUNDNAMES. CSUB wrote no-data and UZF wrote zero, though UZF WATER-CONTENT already stopped. UZF and LAK observation errors now name the input file instead of 'stderr'."
