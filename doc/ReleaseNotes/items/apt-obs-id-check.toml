section = "fixes"
subsection = "advanced"
description = "Advanced transport and energy package observations (LKT, SFT, MWT, UZT, LKE, SFE, MWE and UZE) now stop the simulation with an error when they give a feature number of 0. Previously some of these observations ran and reported a value read from outside the package's arrays. An observation of a feature's aquifer connections (the LKT, SFT, MWT, UZT, LKE, SFE, MWE and UZE types, and the TO-MVR type in LKT and LKE) on a feature with no such connections also no longer reads an uninitialized index. Simulated concentrations, temperatures and flows were not affected."
