section = "features"
subsection = "solution"
description = "A warning now reports GWF cells that have no storage, head-dependent boundary, or constant head and are connected only to cells like themselves, so that their heads are not determined. A table in the simulation listing file lists each cell once, by model and cell ID, with whether it was cut off by the input (IDOMAIN, hydraulic conductivity, barriers, or missing boundaries) or was dry with dry neighbors, as can happen with the Newton-Raphson formulation, and whether it was later reconnected to storage or a boundary. The first assembly of the equations is checked. The new command line switch (\\texttt{-ci} or \\texttt{\\doubledash check-isolated}) checks the first outer iteration of every time step, or every outer iteration with \\texttt{-ci all}. The \\texttt{-m validate} mode now assembles the equations of each solution with a GWF model at the starting heads of each stress period, without solving them, and checks them the same way."
