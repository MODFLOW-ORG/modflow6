section = "fixes"
subsection = "advanced"
description = "A Lake (LAK) Package using the IMPLICIT option coupled a lake to the wrong cell when a vertically connected cell went dry under the standard (non-Newton) formulation. The connection moves to the active cell below the dry cell, but the exchange with the lake was still assembled for the dry cell, so the cell below received the lake exchange without its coupling to the lake stage. The cell below could go dry and the lake budget could fail to close, without a convergence failure. A connection that has moved is now coupled on the cell it moved to, as the default formulation does, and the results match the default formulation. Models that do not use the IMPLICIT option, or that use the Newton formulation, are unaffected."
