section = "fixes"
subsection = "model"
description = "The GNC package didn't check the number of rows in the GNCDATA block against NUMGNC. With too few rows it read out of bounds, and with too many it ignored the extra rows, which changed results. Either is now an error. A GNCDATA block with no END line at the end of the file, which was previously accepted, is now also an error."
