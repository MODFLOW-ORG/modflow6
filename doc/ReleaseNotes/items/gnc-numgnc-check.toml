section = "fixes"
subsection = "model"
description = "The ghost-node correction (GNC) package now stops with an error if the number of rows in the GNCDATA block does not match NUMGNC. Previously, too few rows could cause a crash or incorrect results, and rows beyond NUMGNC were ignored, so those corrections were not applied. The GNCDATA block must now also end with an END GNCDATA line, which could previously be left out at the end of the file."
