section = "features"
subsection = "model"
description = "The advection package (ADV) in the GWE and GWT models has been extended with a new ULTIMATE scheme, an implementation of the third-order total variation diminishing scheme of MT3DMS. The face concentration is a QUICKEST reconstruction, built from the two cells straddling a face plus the second cell upstream, that is then clamped by a universal limiter to enforce the TVD condition. It resolves sharp fronts with substantially less numerical dispersion than the existing TVD and UTVD schemes, and is exact for advection at a Courant number of one. The scheme is formulated for structured grids and is available only for the DIS discretization in sequential simulations. Unlike the other advection schemes it is explicit, and so is stable only for a Courant number of one or less: it requires the adaptive time stepping (ATS) Package to be active and the ATS\\_PERCEL option to be specified with a value no greater than one. The Courant number is also verified against the time step actually taken, and the simulation stops with an error identifying the offending cell if the limit is exceeded. The reconstruction is multidimensional: the face concentration is the average of the concentration over the volume swept through the face during the time step, which carries transverse advection, transverse curvature and twist terms in addition to the terms normal to the face.  Where sorption or heat stored in the solid matrix retards the front, the scheme accounts for the retardation in both its time step and its reconstruction, so ATS\\_PERCEL is interpreted as a fraction of a cell traversed by the retarded front.  This differs from MT3DMS, which reconstructs the face value from the unretarded velocity.  The universal limiter is derived in one dimension, so the scheme is not strictly monotone where flow is oblique to the grid; the overshoot this produces is small and is comparable to that of MT3DMS."
