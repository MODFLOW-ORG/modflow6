section = "fixes"
subsection = "advanced"
description = "In the Lake (LAK) Package, a time series assigned to an OUTLETS block value (INVERT, WIDTH, ROUGH or SLOPE) was registered with an incorrect row number. If the outlet's OUTLETS row number was greater than NLAKES, the row number was read from outside the bounds of an array, which could produce an undefined value or, rarely, a crash. Otherwise, a lake number was used. Simulated values were not affected, but the row reported for the outlet's time-series updates in the simulation listing file (with PRINT\\_INPUT) could be wrong. Outlet time series are now registered with, and reported by, their outlet number."
