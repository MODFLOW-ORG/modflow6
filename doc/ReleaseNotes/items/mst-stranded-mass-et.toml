section = "features"
subsection = "model"
description = "The STRANDED\\_MASS option of the Mobile Storage and Transfer (MST) Package now also holds solute that a sink carrying no solute leaves behind, such as evapotranspiration given a mixed (AUXMIXED) concentration in the Source and Sink Mixing (SSM) Package. The share of that solute in the drained part of a cell is deposited there instead of being concentrated into the water that remains, and returns as the cell rewets and as recharge flushes it, so a cell with steady evapotranspiration and recharge reaches a steady concentration. Without it, the concentration of a cell that evapotranspiration nearly drains grows without bound and, with the Newton formulation, the transport solution can fail, while the model budget reports no error. Saturated cells are unaffected."
