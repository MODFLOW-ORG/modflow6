section = "fixes"
subsection = "model"
description = "On a DISV grid, the PRT Model could give wrong pathlines in a rectangular cell with a side shared by more than two neighbors, or by two neighbors of unequal size. Particles could enter the wrong neighbor, skip a neighbor entirely, or travel at the wrong speed. Such cells are now tracked with the ternary method. Quadtree grids with at most 2:1 refinement between neighbors are not affected."
