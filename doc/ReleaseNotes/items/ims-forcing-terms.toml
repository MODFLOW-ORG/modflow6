section = "features"
subsection = "solution"
description = "Added FORCING\\_TERMS and BACKTRACKING\\_SUFFICIENT\\_DECREASE options to the IMS NONLINEAR block for solutions with Newton-Raphson models. FORCING\\_TERMS also ends a linear solve when the residual is reduced by an Eisenstat-Walker forcing term recalculated every outer iteration, which avoids solving the linear system more accurately than the outer iteration needs. BACKTRACKING\\_SUFFICIENT\\_DECREASE also accepts a backtracking step only if it sufficiently reduces the residual, in place of BACKTRACKING\\_TOLERANCE. The options can conflict with delta-bar-delta under-relaxation and are off by default."
