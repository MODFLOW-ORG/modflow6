section = "features"
subsection = "advanced"
description = "A new Variably Saturated Surface Boundary (VSSB) Package for models that use the Variably Saturated Flow (VSF) Package applies precipitation to the top face of a set of surface cells. Infiltration is limited by the soil through a conductance scaled by the relative permeability, water that cannot infiltrate is stored in a pond of limited depth, groundwater can exfiltrate into the pond, and water that cannot be stored leaves the package as runoff, which can be provided to the Water Mover (MVR) Package. Evaporation can be simulated through a specified potential EVAPORATION rate; the demand is met first from ponded water and the remainder is applied to the soil as bare-soil evaporation reduced by the relative permeability of the top cell."
