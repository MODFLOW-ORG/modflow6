section = "fixes"
subsection = "model"
description = "In GWT and GWE models, a flow package with more boundaries than MAXBOUND in its SPC6 input could go undetected and produce incorrect concentrations or temperatures. This could happen when the number of boundaries increased in a stress period with no SPC6 PERIOD block, or when the transport model was coupled to a separate flow simulation through the Flow Model Interface (FMI) package. The simulation now stops with an error. The check that SPC6 and SPCA6 input is paired with the matching list-based or array-based flow package now also runs in every stress period."
