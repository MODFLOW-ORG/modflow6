section = "fixes"
subsection = "model"
description = "In the Particle Release Point (PRP) Package, a file with no release times, no release time frequency, and only PERIOD blocks numbered above NPER has received the default release since version 6.6.3, as if it had no PERIOD blocks. It now releases nothing, as in versions 6.6.0 through 6.6.2. PRP now also writes a warning when the input configures releases but none will happen, naming the cause: all PERIOD blocks are numbered above NPER, or all release times are negative or fall after the end of the simulation."
