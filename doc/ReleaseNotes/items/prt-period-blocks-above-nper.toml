section = "fixes"
subsection = "model"
description = "If no release times, release time frequency, or PERIOD blocks are given, the Particle Release Point (PRP) Package is intended to default to releasing one particle from each release point at the start of the simulation. Previously, a package with no release times or release time frequency, whose PERIOD blocks were all numbered above NPER (for example after NPER was reduced to temporarily shorten a simulation under development), still applied the default release. Such a package will now release no particles. PRP will now also write a warning when release times or PERIOD blocks are present but no particles will be released, stating the reason. This happens when no PERIOD block is numbered within NPER and no release time falls within the simulation (all release times are negative or, without EXTEND\\_TRACKING, beyond the end of the simulation's time discretization)."
