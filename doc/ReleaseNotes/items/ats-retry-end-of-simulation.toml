section = "fixes"
subsection = "basic"
description = "With adaptive time stepping (ATS), a simulation could end before the end of the last stress period and still report normal termination. This happened when the final time step failed to converge and was retried with a shorter time step: the simulation stopped after the first shorter step that converged. This could have multiple consequences. PRT particles were terminated at that (incorrect) time, or with the EXTEND\\_TRACKING option were tracked onward using the flows from that shorter step instead of the flows for the rest of the period. Through the BMI, update\\_until returned at the incorrect time as well. Simulations using ATS now run to the end of the last stress period."
