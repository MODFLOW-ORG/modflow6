section = "fixes"
subsection = "basic"
description = "With adaptive time stepping (ATS), if a time step that would have ended the simulation failed to converge and was retried with a shorter step, the simulation stopped after the retried step, before the end of the last stress period, and still reported normal termination. PRT particle tracking and BMI update\\_until were affected the same way. Simulations now run to the end of the last stress period."
