section = "fixes"
subsection = "basic"
description = "With adaptive time stepping (ATS), if a time step that would have ended the simulation failed to converge and was retried with a shorter time step, the simulation stopped after the shorter step, before the end of the last stress period, and still reported normal termination. PRT particles were terminated at that time, or with EXTEND\\_TRACKING were tracked to their stop time using the flows at that time, and the BMI update\\_until function returned at that time. The simulation now continues to the end of the last stress period."
