section = "features"
subsection = "model"
description = "The Mobile Storage and Transfer (MST) Package of the Groundwater Transport (GWT) Model now holds the solute that stays behind when a cell drains, in the water retained against drainage and as sorbed mass, as stranded mass until the cell rewets; earlier versions returned it to the water that remains, so the simulated concentration rose as the water table fell. Results change for an unconfined model whose specific yield differs from its porosity or that has sorption. The new LEGACY\\_STORAGE option restores the earlier formulation; it is deprecated and will be removed in a future release. Stranded mass is not simulated in a model with the Unsaturated Zone Transport (UZT) Package."
