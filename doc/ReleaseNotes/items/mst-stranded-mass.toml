section = "features"
subsection = "model"
description = "The Mobile Storage and Transfer (MST) Package of the Groundwater Transport (GWT) Model now simulates stranded mass. The mobile domain scales the solute mass of a cell by its saturation, so in earlier versions the solute that the drained part of a cell held was returned to the water that remains when the water table fell, and the simulated concentration rose. That solute is now held out of the mobile domain until the cell rewets, and the mass returned is the mass the same cell gave up. Two quantities are held back: the solute in the water retained against drainage, which follows from the porosity of the transport model and the specific yield of the flow model rather than from new input, and the sorbed mass. Stranded mass decays at the rates given for the aqueous and sorbed phases, is reported in a budget for the package, and can be written to a binary array file. Results change for an unconfined model whose specific yield differs from its porosity or that has sorption. The new LEGACY\\_STORAGE option restores the formulation of earlier versions; it is deprecated and will be removed in a future release. Stranded mass is not simulated, and a note is written, in a model with the Unsaturated Zone Transport (UZT) Package, or that reads its flows from a budget file without the STO-SY term."
