section = "features"
subsection = "advanced"
description = "Added a STRANDED\\_MASS option to the Lake Transport (LKT) and Streamflow Transport (SFT) Packages of the Groundwater Transport (GWT) Model. When a lake or reach loses the last of its water and no water that carries solute leaves it, as when it evaporates dry or a reach that the SFR Package does not route through storage loses its inflow, its solute is held, as the salts that an evaporating water body leaves behind are, and is returned as the lake or reach rewets, in proportion to the volume regained relative to the largest volume it held since it was last dry. Without the option, the transport solution of a lake that evaporates dry cannot be found, and the solute of a reach that goes dry is discarded without appearing in the package budget. The held mass is reported as the STRANDED term of the package budget and as the stranded observation, which appear only when the option is used, and the option is not available for energy transport."
