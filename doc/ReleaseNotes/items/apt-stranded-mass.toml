section = "features"
subsection = "advanced"
description = "The Lake Transport (LKT) and Streamflow Transport (SFT) Packages of the Groundwater Transport (GWT) Model now hold the solute of a lake or stream reach that goes dry. When a lake or reach loses the last of its water and no water that carries solute leaves it, as when it evaporates dry or a reach that the SFR Package does not route through storage loses its inflow, its solute is held, as the salts that an evaporating water body leaves behind are, and is returned as the lake or reach refills above the highest volume it has reached since it went dry, in proportion to the part of its largest volume that it regains. In earlier versions, the transport solution of a lake that evaporates dry could not be found, and the solute of a reach that goes dry was discarded without appearing in the package budget. The held mass is reported as the STRANDED term of the package budget and as the stranded observation. The LEGACY\\_STORAGE option of the Mobile Storage and Transfer (MST) Package turns this off along with stranded mass in the aquifer. Energy transport is unaffected."
