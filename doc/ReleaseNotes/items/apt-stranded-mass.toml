section = "features"
subsection = "advanced"
description = "The Lake Transport (LKT) and Streamflow Transport (SFT) Packages of the Groundwater Transport (GWT) Model now hold the solute of a lake or stream reach that goes dry, as an evaporating water body leaves its salts behind, and return it as the lake or reach refills. Previously, the transport solution of a lake that evaporated dry could not be found, and the solute of a reach that went dry was discarded without appearing in the package budget. The held mass is reported as the STRANDED budget term and observation of the package. The new STRANDED\\_TOLERANCE option of the LKT and SFT Packages sets when a lake or reach holds its solute, and the STRANDED FILEOUT option and STRANDEDDATA block carry the held mass from one simulation to the next. The LEGACY\\_STORAGE option of the Mobile Storage and Transfer (MST) Package turns this off."
