section = "fixes"
subsection = "model"
description = "A PRT particle on the cell face it exits through, for example one released on that face, could be given a tiny nonzero or even negative travel time to the face instead of zero, depending on the compiler and its floating point optimizations (as with the Intel ifx compiler's defaults). A negative travel time moved the particle back in time, which could change the order of reported events or cause a tracking time to be skipped. Such exits now take exactly zero time, and travel times are never negative."
