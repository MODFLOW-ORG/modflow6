section = "fixes"
subsection = "internal"
description = "Since version 6.8.0, the Time-Varying Hydraulic Conductivity (TVK) and Time-Varying Storage (TVS) Utilities applied every value given in earlier PERIOD blocks again at each later PERIOD block, and at every time step when a time series file was specified. With K22OVERK or K33OVERK in the Node Property Flow (NPF) Package, a K22 or K33 ratio given in an earlier stress period was then applied to a K value changed in a later stress period, so K22 or K33 changed as well; with PRINT\\_INPUT the earlier values were listed again. As in version 6.7, a value is now applied only when it is given in a PERIOD block or updated by its time series, and it keeps that value until it is changed. With PRINT\\_INPUT, each applied value is listed with its stress period and time step. Values given in a PERIOD block are now applied when the time step is advanced, so through the API the changed properties are available after prepare\\_solve rather than after prepare\\_time\\_step, and a value set through the API before prepare\\_solve is replaced where TVK or TVS applies a value in that time step."
