section = "fixes"
subsection = "model"
description = "The default RELEASE\\_TIME\\_TOLERANCE in the Particle Release Point (PRP) Package, which sets how close two release times must be to be merged into one, was a fixed value of about $2.2 \\times 10^{-5}$ model time units, so its effect depended on the model's time scale. The default is now about $2.2 \\times 10^{-9}$ times the simulation length (the sum of all stress period lengths), which gives the same value as before for a simulation of $10^{4}$ time units. Release times that are indistinguishable at floating-point precision are always merged, even if a smaller tolerance is specified. The effective tolerance is now written to the listing file. Models with release times closer together than the old or new default tolerance may release a different number of particles: more in very short simulations, fewer in very long ones. The previous behavior can be restored by setting RELEASE\\_TIME\\_TOLERANCE explicitly."
