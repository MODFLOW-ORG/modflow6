section = "fixes"
subsection = "model"
description = "In the Particle Release Point (PRP) Package, release times closer together than RELEASE\\_TIME\\_TOLERANCE are merged into a single release. The default tolerance was a fixed $2.2 \\times 10^{-5}$ model time units, which is coarse for simulations with short time scales and negligible for those with long ones. The default now scales with the simulation length (the sum of all stress period lengths), at about $2.2 \\times 10^{-9}$ times that length, matching the previous default for a simulation $10^{4}$ time units long. Simulations with release times very close together may release a different number of particles than before: more if the simulation is much shorter than $10^{4}$ time units, fewer if it is much longer. To keep the previous behavior, set RELEASE\\_TIME\\_TOLERANCE to 2.2E-5. The tolerance in use is now reported in the PRP options section of the listing file."
