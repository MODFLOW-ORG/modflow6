section = "fixes"
subsection = "stress"
description = "Grid array input (READARRAYGRID) for the CHDG, DRNG, GHBG, RIVG and WELG packages could define boundaries incorrectly. Values at inactive cells (IDOMAIN less than one) were counted as boundaries, which could exceed MAXBOUND, and boundaries could be dropped or applied at the wrong cell without a message; values at inactive cells are now ignored, and a PERIOD block whose first array has no defined values at active cells has no boundaries (previously the next array, such as an auxiliary variable, defined them). An array read with a FACTOR scaled the DNODATA value (3.0E+30), so those cells were treated as defined; FACTOR no longer scales DNODATA in any real array input. NetCDF export (EXPORT\\_ARRAY\\_NETCDF) writes the fill value at inactive cells."
