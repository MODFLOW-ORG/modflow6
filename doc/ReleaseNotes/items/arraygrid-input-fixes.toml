section = "fixes"
subsection = "stress"
description = "Grid array input (READARRAYGRID) for the CHDG, DRNG, GHBG, RIVG and WELG Packages could define boundaries incorrectly. Boundary cells are now the active cells (IDOMAIN greater than zero) where every non-auxiliary array given in a PERIOD block has a value other than DNODATA (3.0E+30); previously the first array listed defined the boundary cells, or the next array, which could be an auxiliary variable, if the first had no defined values, and values at inactive cells were counted, which could exceed MAXBOUND. An array not given in a PERIOD block now carries forward by cell, and a new boundary cell is an input error unless the array is given; previously values carried forward by position in the boundary list, which applied them at the wrong cells when the boundary cells changed. An auxiliary array given without a value at a boundary cell is now an input error; previously DNODATA was applied as its value. FACTOR in real array input and SFAC in a time-array series no longer scale DNODATA, which made those cells appear defined. NetCDF export (EXPORT\\_ARRAY\\_NETCDF) writes the fill value at inactive cells."
