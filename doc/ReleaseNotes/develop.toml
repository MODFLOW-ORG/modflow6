[[items]]
section = "features"
subsection = "model"
description = "Added a new STRANDED\\_MASS option to the Mobile Storage and Transfer (MST) Package of the Groundwater Transport (GWT) Model. The mobile domain scales both the dissolved and the sorbed solute mass by the saturation of a cell, so when a cell drains the solute it held is returned to the water that remains and the simulated concentration rises. When STRANDED\\_MASS is specified, the solute held by water that does not drain, given by the new RESIDUAL\\_WATER\\_CONTENT griddata array, and all of the sorbed mass, are instead held out of the mobile domain until the cell rewets. The mass that returns when a cell rewets is the mass that the same cell gave up, so mass is conserved without reference to neighboring cells; a cell that drains completely and rewets completely recovers all of it. Stranded mass decays at the rates given for the aqueous and sorbed phases, and because that decay never passes through the concentration equation it is reported in a separate budget for the package; only the transfer between the mobile domain and the stranded mass appears in the model budget, as STORAGE-STRANDED. With RESIDUAL\\_WATER\\_CONTENT left at its default of zero only sorbed mass is stranded, which requires no additional input. Stranded mass can be written to a file using the STRANDED FILEOUT option, and cannot be used with the Immobile Storage and Transfer (IST) Package."
