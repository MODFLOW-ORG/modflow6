[[items]]
section = "features"
subsection = "basic"
description = "The Iterative Model Solution (IMS) now supports stress-period-varying linear settings. A LINEAR\\_PERIODDATA option in the IMS OPTIONS block names an input file with keyword PERIOD blocks that override selected LINEAR-block settings---the inner closure tolerances (INNER\\_DVCLOSE, INNER\\_RCLOSE), the inner maximum (INNER\\_MAXIMUM), and the preconditioner (PRECONDITIONER\\_LEVELS, PRECONDITIONER\\_DROP\\_TOLERANCE, RELAXATION\\_FACTOR)---for the specified stress period and all subsequent stress periods until changed. Changing the preconditioner reallocates and refactors it as needed. This capability is supported for both serial and parallel simulations; in parallel, keywords that control a component provided natively by PETSc (through the .petscrc file) rather than by IMS are rejected. The updated settings are written to the simulation listing file as each PERIOD block is applied, so the listing reports the linear settings actually in effect for the stress period."
