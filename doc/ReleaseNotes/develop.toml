[[items]]
section = "fixes"
subsection = "model"
description = "The DISU Package now checks the ANGLDEGX values specified for horizontal connections between active cells. A warning is issued if the values for a connection and its reverse connection do not differ by 180 degrees, or, when VERTICES and CELL2D are specified, if the face normal points away from the connected cell or differs by more than 1 degree from the normal computed from the vertices shared by the two cells. The NPF Package terminates with an error if any of these conditions is not met and ANGLDEGX is required input, that is, if XT3D, K22, or SAVE\\_SPECIFIC\\_DISCHARGE is specified. A separate warning flags normals that deviate by more than 45 degrees from the direction between the cell centers, which is not an error but may warrant a closer look at the grid. Inconsistent ANGLDEGX values previously went undetected and could produce an invalid coefficient matrix when the XT3D option or horizontal anisotropy was active, which in some cases caused the program to terminate with a floating-point overflow in the linear solver."

[[items]]
section = "fixes"
subsection = "model"
description = "The GWT and GWE Flow Model Interface (FMI) Packages did not recognize the GWFGRID entry in the PACKAGEDATA block and instead attempted to read the binary grid file as an advanced package budget file, causing an invalid method code error. The GWT and GWE FMI Packages now read the binary grid file, as the PRT FMI Package already did, and check that the flow and transport grids match."

[[items]]
section = "fixes"
subsection = "basic"
description = "Budget values with three-digit exponents were not always written to the list file with the E character (for example, 8.5159-100 instead of 8.5159E-100), which is valid Fortran but cannot be read by some post-processing tools. This occurred for absolute values between 1.0E-100 and 1.0E-99 and for values that round up to 1.0E+100. These values are now written with the E character."

[[items]]
section = "fixes"
subsection = "advanced"
description = "The Unsaturated Zone Flow (UZF) Package allocated and deallocated a complete set of unsaturated-zone work arrays on every evapotranspiration calculation, and a second, smaller set on every wave-routing calculation, once per UZF cell per outer iteration per time step. The work arrays are now allocated once when the package is set up, which reduces run times by 19 to 34 percent for the UZF test problems. Results are unchanged. The wave capacity NWAV and the number of trailing waves NTRAIL are now scalars rather than arrays with one value per UZF cell, so a program that reads them through the BMI or XMI interface must be updated."

[[items]]
section = "fixes"
subsection = "basic"
description = "The Unsaturated Zone Flow (UZF) Package unsaturated-zone state is registered with the memory manager, and is therefore visible through the BMI and XMI interfaces, under names inherited from MODFLOW-2005 that did not describe their contents. The wave arrays UZDPST, UZTHST, UZFLST, UZSPST, and NWAVST are now WAVE\\_DEPTH, WAVE\\_THETA, WAVE\\_FLUX, WAVE\\_SPEED, and NWAVES, and the cell properties THTR, THTS, THTI, EXTWC, EPS, HA, HROOT, and ROOTACT are now THETA\\_RES, THETA\\_SAT, THETA\\_INIT, THETA\\_EXT, BC\\_EPS, AIR\\_ENTRY, ROOT\\_POT, and ROOT\\_ACT. Other UZF variables are renamed on the same principle, and the extinction depth, which was registered as EXDP\\_PVAR, is now EXTDP\\_INPUT. The previous names are checked in to the memory manager as aliases of the renamed variables, so a program that reads UZF variables by name through the BMI or XMI interface continues to resolve either name. The exceptions are NWAV and NTRAIL, which changed from arrays with one value per UZF cell to scalars and could not be aliased. Input files, keywords, and simulated results are unaffected."
