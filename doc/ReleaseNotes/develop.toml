[[items]]
section = "features"
subsection = "model"
description = "Added a new STRANDED\\_MASS option to the Mobile Storage and Transfer (MST) Package of the Groundwater Transport (GWT) Model. The mobile domain scales the solute mass of a cell by the saturation of the cell, so when the water table falls the solute that the drained part of the cell held is returned to the water that remains and the simulated concentration rises. When STRANDED\\_MASS is specified, the solute that stays behind is instead held out of the mobile domain until the cell rewets. Two quantities are held back: the solute in the water that is retained against drainage, which is the difference between the change in the volume of water in the mobile domain and the water released to storage by the flow model, and the sorbed mass, because the solid aquifer material does not drain. The volume of retained water is not specified by the user; it follows from the porosity of the transport model and the specific yield of the flow model, and it is zero when the two are equal or when the specific yield is the larger, which is reported as a warning. The mass that returns when a cell rewets is the mass that the same cell gave up, so mass is conserved without reference to neighboring cells, and a cell that drains and rewets completely recovers all of it. Stranded mass decays at the rates given for the aqueous and the sorbed phases, and because that decay never passes through the concentration equation it is reported in a budget for the package; only the transfer between the mobile domain and the stranded mass appears in the model budget, as STORAGE-STRANDED. Stranded mass can be written to a file using the STRANDED FILEOUT option. No mass is stranded during the first time step of a simulation, because the saturation of the previous time step is not available then. A transport model that reads its flows from a budget file requires the STO-SY flow term in that file, which the flow model writes only if its Storage (STO) Package saves flows and uses specific yield; without it the volume of water retained against drainage cannot be determined and the simulation terminates with an error. The option cannot be used with the Immobile Storage and Transfer (IST) Package, and should not be used with the Unsaturated Zone Transport (UZT) Package."
