[[items]]
section = "features"
subsection = "exchanges"
description = "The IDOMAIN array of a GWT or GWE model no longer has to be identical to the IDOMAIN array of the GWF model that supplies its flows through a GWF-GWT or GWF-GWE exchange. Cells that are active in the GWF model can now be excluded from the transport model, so that transport is simulated for only part of the flow system. A cell that is active in the transport model must still be active in the GWF model, and an error is reported for every cell that violates that requirement. Water that crosses the boundary of a reduced transport domain is carried by the flow imbalance, so the FLOW\\_IMBALANCE\\_CORRECTION option should be activated in the FMI Package; a warning is written when it is not. The correction accounts for advection only, so the boundary of a reduced transport domain is a zero dispersive-flux boundary in GWT and a zero conductive-flux boundary in GWE. A model with a reduced transport domain can also be coupled to another transport model through a GWT-GWT or GWE-GWE exchange; the transport exchange is now matched to the corresponding flow exchange by user node number rather than by reduced node number so that the match succeeds when the two models exclude different cells. A reduced transport domain is supported in a parallel simulation. It is not supported for an advanced transport package (LKT, SFT, MWT, UZT, LKE, SFE, MWE, UZE) connected to a cell outside the transport domain, which is reported as an error."

[[items]]
section = "fixes"
subsection = "exchanges"
description = "A GWE model coupled to another GWE model through a GWE-GWE exchange used the wrong equation scaling factor in the interface model when the GWE models did not include a Conduction and Dispersion (CND) Package. The interface model took the scaling factor from CND, so without CND it kept its default value of one instead of the product of the density and the heat capacity of water. Advective energy transport across the exchange was reduced by that factor, which is about 4.2 million for the default water properties, so essentially no energy crossed the exchange and simulated temperatures accumulated in the upgradient model while the model budgets continued to close. The interface model now takes the scaling factor from the GWE model itself, which is where CND obtained it, so results are unchanged when CND is active."
