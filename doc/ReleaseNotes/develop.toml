[[items]]
section = "features"
subsection = "advanced"
description = "Added a new IMPLICIT option to the Lake (LAK) Package that solves each lake stage as an additional unknown in the groundwater flow matrix instead of by the default substitution-iteration solver. The implicit formulation typically converges in far fewer outer iterations and can solve problems for which the default formulation fails to converge, while giving equivalent results. It makes the coefficient matrix asymmetric and therefore requires the BICGSTAB linear acceleration in the Iterative Model Solution (IMS). A lake that is too poorly conditioned to solve as a matrix unknown is automatically solved by the default substitution solver instead, so the option is as robust as the default formulation."

[[items]]
section = "features"
subsection = "stress"
description = "Added a new AUTO\\_FLOW\\_REDUCE\\_AUXNAME option to the Well (WEL) Package. When AUTO\\_FLOW\\_REDUCE is active, the pumping rate of a well is smoothly reduced as the cell head drops toward the cell bottom, using a single global turnoff threshold for all wells in the package. The new AUTO\\_FLOW\\_REDUCE\\_AUXNAME option names an auxiliary variable whose value sets the turnoff threshold for each well individually, so different wells in the same package can begin reducing their pumping at different heads. The per-well auxiliary value overrides the global AUTO\\_FLOW\\_REDUCE value and is interpreted the same way: as a length above the cell bottom when FLOW\\_REDUCTION\\_LENGTH is specified, or otherwise as a fraction of the cell thickness. If AUTO\\_FLOW\\_REDUCE\\_AUXNAME is specified without AUTO\\_FLOW\\_REDUCE the option is ignored with a warning, and an error is reported if the named auxiliary variable does not exist."

[[items]]
section = "features"
subsection = "advanced"
description = "A TVD (Total Variation Diminishing) kinematic-wave routing scheme has been added to the SFR Package. The option is activated by specifying the ATS\\_COURANT parameter in the OPTIONS block, which also enables adaptive time stepping to maintain a target Courant number. The TVD scheme applies a van Leer flux limiter to reduce numerical diffusion, with the largest reductions at Courant numbers approaching unity, and computes reach storage by direct volume balance, guaranteeing exact budget closure at every reach and every time step. The TVD scheme is most appropriate when exact mass conservation is required, such as when simulated streamflows will be used as input to a solute transport model; because the explicit formulation targets Courant numbers at or below unity, it typically requires sub-daily time steps. The standard kinematic-wave scheme (STORAGE keyword) is sufficient for most stream-routing applications and accommodates Courant numbers from about 0.5 to 2. A Courant number summary table is written to the GWF model listing file when ATS\\_COURANT is specified."

[[items]]
section = "documentation"
subsection = "advanced"
description = "A new chapter describing the SFR Package kinematic-wave routing options has been added to the Supplemental Technical Information document. The chapter describes the kinematic wave approximation, the four-point implicit finite-difference discretization, the standard (STORAGE keyword) and TVD (ATS\\_COURANT keyword) routing schemes, example comparisons against exact kinematic-wave solutions for a two-reach MODFLOW 6 model at Courant numbers ranging from 0.5 to 2.0, and practical guidance for selecting a suitable time step."

[[items]]
section = "documentation"
subsection = "advanced"
description = "A new chapter describing recent changes to the MAW Package that facilitates non-vertical wells has been added to the Supplemental Technical Information document.  The chapter describes the use of the NON\\_VERTICAL\\_WELLS option.  Specifically, it provides details on how the in-cell conductance between the aquifer and a tilted MAW feature is calculated using the screen top, screen bottom, well radius, a tilt angle, and the saturated conductance."

[[items]]
section = "documentation"
subsection = "advanced"
description = "A new chapter describing the IMPLICIT option in the LAK Package has been added to the Supplemental Technical Information document.  The new option treats lake stage as an additional unknown in the groundwater matrix, solving it simultaneously with groundwater heads and assembling seepage as conductance couplings between lake and cell rows (in the matrix). Non-seepage budget terms are linearized and incorporated into the matrix. Newton under-relaxation is recommended for lakes that may dry to prevent stage from dropping below the lake bottom. The implicit approach eliminates stage lag, greatly accelerates convergence for strongly coupled lakes, and reliably solves cases where the default method may struggle. Ultimately, both formulations should yield equivalent water balances and results at convergence, the new option may offer speedier solutions in some cases."

[[items]]
section = "fixes"
subsection = "stress"
description = "The default values for DENSITY\\_WATER, HEAT\\_CAPACITY\\_WATER, LATENT\\_HEAT\\_VAPORIZATION specified in the OPTIONS block were not set as indicated in the MF6IO guide.  Defaults for these three variables now set as documented in the MF6IO guide."

[[items]]
section = "fixes"
subsection = "stress"
description = "For the Well (WEL) Package, when AUTO\\_FLOW\\_REDUCE is active and FLOW\\_REDUCTION\\_LENGTH is specified, the Newton-Raphson linearization incorrectly used the cell thickness instead of the unit length (1.0) when computing the turnoff threshold. This produced an incorrect Jacobian term and inconsistent behavior between the standard and Newton formulations. The thickness calculation in the Newton code path now respects the FLOW\\_REDUCTION\\_LENGTH option, consistent with the non-Newton code path."

[[items]]
section = "fixes"
subsection = "stress"
description = "Errors detected while reading the OPTIONS block of the Drain (DRN) and Well (WEL) Packages, such as an AUXDEPTHNAME or AUTO\\_FLOW\\_REDUCE\\_AUXNAME that names an auxiliary variable that does not exist, were reported for the input file of the next package read rather than for the file that contained the error. These errors are now reported for the DRN or WEL input file."

[[items]]
section = "fixes"
subsection = "solution"
description = "A time step length submitted to the adaptive time stepping (ATS) Package by a package that needs to limit the step for its own stability was discarded whenever DTADJ for that period was zero or one.  DTADJ is the multiplier ATS applies when it lengthens or shortens the step in response to the solver iteration count, and the documentation states that a value of zero or one means it has no effect on the simulation.  In that case, the step lengths submitted by packages should be honored.  Three packages submit a step this way: the ADV Package of the GWT and GWE models submits the advective Courant limit, and the SFR Package of the GWF model submits the kinematic wave limit.  With DTADJ set to zero or one those limits had no effect at all, in either direction, so the time step was neither raised nor lowered toward the stable value.  In particular the ATS\\_PERCEL option of the ADV Package, which limits the fraction of a cell that may be traversed in one time step, was accepted without complaint and then ignored.  The test that discards the submitted length now applies only where DTADJ is actually used."

[[items]]
section = "fixes"
subsection = "internal"
description = "Resolved mass-balance errors in the Central and UTVD numerical schemes caused by inconsistent interpretation of cell-to-interface distances (cl1/cl2)."

[[items]]
section = "fixes"
subsection = "exchanges"
description = "When a MVR connection was included as part of an exchange between two models, it was possible to list a model name in the PACKAGES block of the MVR input file that is not one of the two models included in the exchange.  A check was added that reports an error message stating that a model name listed in the exchange MVR input file is not one of the two models connected by the exchange."

[[items]]
section = "fixes"
subsection = "model"
description = "The Flow Model Interface (FMI) package for transport and tracking models conducts TDIS compatibility checks during each stress period to ensure that the model's time discretization is compatible with that of the flow model. In particular, if a flow model stress period has just one time step, the transport or tracking model may have any number of time steps. However, if a flow model stress period has more than one time step, the transport or tracking model must have the same number of time steps. Simulations would previously stop with an error if the transport or tracking model violated this rule for any stress periods up to the simulation's last, but would not raise an error for the last stress period. The compatibility check was updated to include the last stress period. Simulations will now stop with an error if the transport or tracking model violates this rule for any stress period in the simulation."

[[items]]
section = "fixes"
subsection = "internal"
description = "When a horizontal flow barrier is placed between two cells, MODFLOW checks to ensure that the cells are adjacent.  This check did not function correctly for DISU grids, in some cases, if the IDOMAIN functionality was used to remove cells.  The check for two adjacent DISU cells was corrected to work for IDOMAIN functionality."

[[items]]
section = "fixes"
subsection = "parallel"
description = "The adaptive time stepping algorithm (ATS) was not working correctly in parallel mode. This applies to GWT and GWE models, when the model time step derived from the ATS\\_PERCEL parameter is not uniform across processes. In such a case, a deadlock occurred and the simulation was stalled. This fix ensures that the actual calculation time steps are synchronized across all processes such that they remain in lockstep."

[[items]]
section = "fixes"
subsection = "parallel"
description = "Mover (MVR) Package connections across two or more models running in parallel were previously supported for flow but not for solute or energy transport.  GWT-GWT or GWE-GWE exchanges that also include MVT or MVE connections, respectively, is now supported for simulations run in parallel mode."

[[items]]
section = "fixes"
subsection = "exchanges"
description = "Avoids an unhandled and unnecessary exception in cases where a GWF-GWF exchange is configured with a MVR package, but the corresponding GWT-GWT exchange does not have a MVT package enabled."

[[items]]
section = "fixes"
subsection = "netcdf"
description = "Fixed an indexing issue in structured NetCDF export where READASARRAYS packages (RCHA, EVTA) with time-varying per-period arrays would crash with a NetCDF edge-exceeds-bound error when writing any stress period after the first."

[[items]]
section = "fixes"
subsection = "basic"
description = "Stop with an informative error if a discretization package is missing after loading the model input file's PACKAGES block."

[[items]]
section = "fixes"
subsection = "model"
description = "Fixed the PRT PRP package's DRAPE option's behavior. A draped particle's release was previously reported in the original release position, followed by a DROPPED (ireason=6) event due to the particle reaching the water table at tracking time as a result of the default DRY\\_TRACKING\\_METHOD setting DROP. This is inconsistent with the intent of the DRAPE option: DRAPE is applied before release to control a particle's release position. Draped particles will now be released in the highest active cell, at the water table if the cell is convertible or at the geometric top if the cell is confined, and no DROPPED event will be reported."

[[items]]
section = "fixes"
subsection = "basic"
description = "Previously, GWF model output files could only be referenced by a single coupled model's FMI package. This might be necessary for certain configurations where multiple transport models or particle tracking models in the same simulation need flow information from a previous GWF simulation. Referencing the same GWF output files from multiple coupled models would cause a crash. Fixed file-opening logic to allow multiple coupled models to refer to the same GWF model's output files."

[[items]]
section = "fixes"
subsection = "model"
description = "PRT was described as configuring a single release at the beginning of the simulation by default, but a release was in fact scheduled for the first time step of every stress period. Fixed the default release behavior so a single release occurs at the beginning of the simulation."

[[items]]
section = "fixes"
subsection = "basic"
description = "The BMI interface's get\\_grid\\_model\\_type function worked only for numerical model types such as GWF, GWT, and GWE, but would crash for PRT models. Fixed the function's implementation to work with all model types."

[[items]]
section = "features"
subsection = "model"
description = "Previously PRT model particle events were written to output file(s) immediately. By default, PRT will now buffer events in memory before writing them to disk. Introduced a new option for the PRT Output Control (OC) package, SCRATCH\\_BUFFER, which enables buffering events in scratch files instead of memory. This can avoid out-of-memory errors at the price of increased file IO and runtime."

[[items]]
section = "fixes"
subsection = "model"
description = "A PRT model coupled by an exchange to a GWF model that uses adaptive time stepping (ATS) would erroneously produce output for discarded/retried time step solve attempts. PRT output would also be erroneously produced for discarded Picard iterations. This has been fixed such that PRT will only produce output for successful solve attempts when used with an ATS flow model, and only for the final Picard iteration when MXITER > 1."

[[items]]
section = "fixes"
subsection = "model"
description = "In MF6.7.0, the PRT model began to require binary grid (GRB) files provided to the Flow Model Interface (FMI) package to contain ICELLTYPE when any Particle Release Point (PRP) package used LOCAL\\_Z release coordinates, so PRT could distinguish confined from convertible cells when converting local z to model z coordinates. This requirement is unnecessary and has been removed. A single formula $z = bot + localz \\cdot sat \\cdot (top - bot)$ works correctly for both cell types, since $sat = 1$ for confined cells, and for convertible cells $sat = (head - bot) / (top - bot)$ clamped to $[0, 1]$. Particle z coordinates near the cell top or bottom may differ slightly from before, since saturation is smoothed near the top and bottom."

[[items]]
section = "fixes"
subsection = "stress"
description = "Reverts a 6.4.3 change that reset auxiliary variable arrays to zero each stress period in READASARRAYS packages (RCHA, EVTA). The earlier change had the consequence of zeroing the AUXMULTNAME multiplier array when not re-specified in a period block, effectively eliminating recharge or ET in subsequent stress periods. This behavior now is consistent across Grid Array and Layer Array package types. GWF models that use RCHA or EVTA and the AUXMULTNAME option may give different answers depending on how auxiliary variables were specified."

[[items]]
section = "features"
subsection = "advanced"
description = "The Multi-Aquifer Well (MAW) Package now supports non-vertical (slanted or horizontal) well connections. When the NON\\_VERTICAL\\_WELLS option is specified, an ANGLEDATA block can be used to assign a tilt angle (deviation from vertical) to individual well connections. The saturated conductance for those connections is scaled by the in-cell screen length, which is calculated from the screen top, screen bottom, well radius, and tilt angle (or specified directly with an optional connection length), instead of the vertical screen thickness. A connection length must be specified for horizontal connections, and the MEAN conductance equation is recommended for horizontal connections. A warning is issued if the horizontal distance spanned by a connection is greater than the maximum horizontal extent of the connected cell, which indicates that the tilt angle or specified connection length should be reduced, or that the connection should be specified as a separate connection to each cell that it passes through."

[[items]]
section = "features"
subsection = "stress"
description = "Grid array-based input (READARRAYGRID) is now available for the CHD, WEL, DRN, RIV, and GHB stress packages.  Grid array-based input allows stress package data to be specified as full-grid arrays using the DNODATA value (3.0E+30) to identify inactive cells.  Auxiliary variable arrays persist across stress periods if not re-specified, and CONSTANT array input is supported for any array after the first in a period block."

[[items]]
section = "fixes"
subsection = "internal"
description = "Fixed a bug in the GWT DSP Package and GWE CND Package affecting the rotation of the velocity-dependent dispersion tensor. The horizontal rotation angle did not preserve the sign of the y-component of flow, which could incorrectly orient the longitudinal and transverse dispersion directions for some flow directions, especially flow with a negative y-component. This could cause excessive apparent transverse plume spreading or insufficient longitudinal spreading. Results may change for transport models using velocity-dependent dispersion in affected flow-direction cases."

[[items]]
section = "features"
subsection = "basic"
description = "The CRS option, which specifies a real-world coordinate reference system (CRS) for a model grid, for example an EPSG code, authority string, or Open Geospatial Consortium Well-Known Text (WKT) specification, is supported for all discretization package types. When CRS is specified, the simulation writes a version 2 binary grid (GRB) file so that the CRS can be included, allowing postprocessors to locate the grid in space."

[[items]]
section = "features"
subsection = "netcdf"
description = "Improved CF-1.11 and UGRID-1.0 compliance for NetCDF output. A new ``crs\\_wkt`` option in the NCF utility package accepts a WKT2 (ISO 19162:2019) string for the projection variable; ``grid\\_mapping\\_name`` is now derived and written automatically. The vertical dimension is renamed from ``z`` to ``layer`` with standard CF axis attributes. UGRID face variables now carry ``mesh``, ``location``, and ``coordinates`` unconditionally."

[[items]]
section = "fixes"
subsection = "advanced"
description = "When the Streamflow Routing (SFR) Package STORAGE option was active, a dry reach that was gaining (groundwater head above the streambed top) with little or no inflow could remain dry and receive no groundwater discharge, instead of rewetting from groundwater as it does when the STORAGE option is not used. This has been fixed so that a dry gaining reach rewets and receives groundwater discharge."


[[items]]
section = "fixes"
subsection = "advanced"
description = "The Multi-Aquifer Well (MAW) Package now damps well-head oscillations under the NEWTON UNDER\\_RELAXATION option, so wells with a single connection to a low hydraulic conductivity cell that could previously oscillate between outer iterations and fail to converge are able to settle. Convergence is also withheld until a damped well's pumping rate stops changing, so a model does not converge while a well is still adjusting. Models that do not use NEWTON UNDER\\_RELAXATION are unaffected."

[[items]]
section = "features"
subsection = "advanced"
description = "When a simulation fails to converge, the Multi-Aquifer Well (MAW) Package now warns for any active extraction well whose requested rate exceeds the maximum the connected aquifer can supply with the well head drawn down to the bottom of the well. The warning names the well, reports the requested and maximum available rates, and suggests reducing the rate, using RATE\\_SCALING, or reviewing the connection conductance."

[[items]]
section = "fixes"
subsection = "advanced"
description = "The Multi-Aquifer Well (MAW) Package well storage term previously held water even when the well head dropped below the bottom of the well. Storage now smoothly goes to zero as the well head approaches the well bottom, removing this unphysical storage; results are unchanged while the well head remains above the well bottom."

[[items]]
section = "fixes"
subsection = "advanced"
description = "For the Multi-Aquifer Well (MAW) Package, the Newton-Raphson formulation added a nonzero saturation-derivative matrix term for connections to confined (non-convertible) cells, where the saturation is constant and the derivative should be zero. This term is now set to zero, making the Newton matrix consistent with the calculated flow and improving convergence when a confined cell's head drops into the well screen interval; converged results are unaffected."

[[items]]
section = "fixes"
subsection = "basic"
description = "Trap duplicate model names and show an informative error message. Previously duplicate model names would cause a simulation to fail with an unrelated error."

[[items]]
section = "fixes"
subsection = "internal"
description = "A new ELASTIC\\_INELASTIC\\_SMOOTHING option was added to the Skeletal Storage, Compaction, and Subsidence (CSUB) Package. In the Newton-Raphson formulation the skeletal specific storage of a delay interbed cell switched abruptly from the elastic to the inelastic value when the effective stress exceeded the preconsolidation stress, so a delay cell held near the preconsolidation stress could oscillate between the two values from one outer iteration to the next and fail to converge. The new option smooths the elastic to inelastic transition over a small effective-stress window and adds the corresponding term to the Newton formulation, improving convergence. Across the smoothing window the reported elastic and inelastic storage and compaction components are partitioned by the smoothing weight so they blend continuously rather than switching abruptly; the total is unchanged. The option is disabled by default, so existing results are unchanged."

[[items]]
section = "features"
subsection = "advanced"
description = "The Skeletal Storage, Compaction, and Subsidence (CSUB) Package previously terminated when the calculated effective stress became small or negative in the effective-stress formulation, where the skeletal specific storage varies as the inverse of the effective stress and is unbounded as the effective stress approaches zero. The effective stress used to calculate the specific storage is now not allowed to fall below a small fraction (0.001) of the geostatic stress, which bounds the specific storage and allows the simulation to continue. The active behavior is reported in the CSUB package settings. A note is written to the model listing file for each time step with a negative effective stress, and a warning reporting the total number of affected time steps is written at the end of the simulation. Negative effective stress typically occurs in uppermost cells where simulated water levels rise above land surface. The head-based formulation is unaffected. The deprecated STRICT\\_EFFECTIVE\\_STRESS option restores the previous terminate-on-negative-stress behavior."

[[items]]
section = "fixes"
subsection = "advanced"
description = "The Skeletal Storage, Compaction, and Subsidence (CSUB) Package terminated when the summed interbed thickness in a cell exceeded the cell thickness, even when the difference was a numerical-roundoff artifact of the input precision. When the excess is within a small fraction (1e-5) of the cell thickness, the interbed thicknesses in the cell are now proportionally scaled to fit and the simulation continues. A larger excess is still an error."

[[items]]
section = "fixes"
subsection = "basic"
description = "The BMI get\\_version, get\\_component\\_name, and get\\_grid\\_type functions assigned the converted C string to a character array longer than the string itself. The assignment is not conforming, which left the amount of the caller's buffer that is written up to the compiler. The assignments were corrected to write only the string and its null terminator."

[[items]]
section = "fixes"
subsection = "advanced"
description = "In the Unsaturated Zone Flow (UZF) Package, when the water content behind the leading wave is already at or below the value implied by the applied infiltration rate, the trailing-wave routine indexed the wave arrays with the array holding the wave count of every UZF cell, instead of with the wave count of the cell being solved. In Fortran this is a vector subscript rather than a single element, so wave depth, water content, and flux were reset at wave positions belonging to other cells, corrupting the wave train of the cell being solved. The routine now indexes the cell being solved. The branch is reached whenever the applied infiltration rate decreases, so simulated recharge, unsaturated zone evapotranspiration, water content, and unsaturated zone storage can change in any transient simulation. The corrupted wave train created spurious unsaturated zone storage: in one of the UZF test problems the largest UZF budget percent discrepancy falls from 4.9e-3 to 4e-6 percent. Simulated heads change very little in that problem, but models in which the number of waves differs between UZF cells, which is typical where infiltration varies in space, are affected more than models in which it does not."

[[items]]
section = "fixes"
subsection = "advanced"
description = "The Unsaturated Zone Flow (UZF) Package wave speed routine assigned its working variable only when the water content behind the wave exceeded the residual water content, and then read that variable regardless. Where the water content was at the residual value, which occurs wherever a wave is reset, the wave speed was computed from whatever the variable happened to contain. Simulated results were therefore dependent on the compiler and on the state of memory, and were not necessarily reproducible between builds of the same program. The variable is now initialized before use."

[[items]]
section = "fixes"
subsection = "advanced"
description = "The Unsaturated Zone Flow (UZF) Package evapotranspiration routine created a new wave one position beyond the current number of waves and only then compared the number of waves with the number allocated, which is NTRAILWAVES multiplied by NWAVESETS. A cell that was already at capacity therefore wrote past the end of its wave storage and into the wave storage of the next UZF cell before the error was detected. The capacity is now checked before the wave is created, so the condition is reported as an error asking for NWAVESETS to be increased, as intended."

[[items]]
section = "fixes"
subsection = "advanced"
description = "The Unsaturated Zone Flow (UZF) Package reset only the first six waves of a UZF cell that no longer contains an unsaturated zone. Any waves beyond the sixth kept the water content, depth, flux, and speed they had before the water table rose above the top of the cell, and were reused if an unsaturated zone formed again. All waves in the cell are now reset. Simulated results can change for cells that carry more than six waves."

[[items]]
section = "fixes"
subsection = "advanced"
description = "The Unsaturated Zone Flow (UZF) Package accepted NTRAILWAVES of 1, which caused a division by zero when trailing waves were created. NTRAILWAVES is now required to be greater than 1, and the error message recommends a value of 7."

[[items]]
section = "fixes"
subsection = "solution"
description = "Six Iterative Model Solution (IMS) input variables that were deprecated in version 6.1.1 have been removed. In the OPTIONS block, CSV\\_OUTPUT has been removed; use CSV\\_OUTER\\_OUTPUT, which writes the same outer iteration information. In the NONLINEAR block, OUTER\\_HCLOSE has been removed; use OUTER\\_DVCLOSE, which it was being copied into. OUTER\\_RCLOSEBND has been removed; it had no effect, because package convergence has been evaluated using OUTER\\_DVCLOSE since version 6.1.1. In the LINEAR block, INNER\\_HCLOSE has been removed; use INNER\\_DVCLOSE, which it was being copied into. A simulation that specifies any of these now stops with an unknown keyword error instead of a deprecation warning."

[[items]]
section = "fixes"
subsection = "basic"
description = "The script that builds the table of deprecations and removals for the release notes accumulated the deprecated and removed versions of a variable under two different keys, so a variable carrying both attributes lost its deprecation version and was reported as having been deprecated in the version in which it was removed. The table was correct until now only because every previous removal was made in the same version as its deprecation."

[[items]]
section = "fixes"
subsection = "advanced"
description = "The groundwater cell number written to the binary budget file for the GWF flow term of the advanced transport and energy transport packages, and for the lakebed and well-aquifer conduction terms of the Lake (LKE) and Multi-Aquifer Well (MWE) Energy Transport Packages, was only evaluated for features with an ACTIVE status. A feature with an INACTIVE status was written with the cell number left over from the last active feature, or with an undefined value if no feature had been active since the package was set up, which was the case when every feature was inactive in the first stress period. Budget entries for inactive features were therefore attributed to the wrong groundwater cell, and an undefined value could terminate the simulation with an out-of-bounds error in a model with a reduced node numbering, or be dropped from the budget file entirely. The cell number is now evaluated for every feature regardless of its status; the flow rate written for an inactive feature is zero, as before."

[[items]]
section = "fixes"
subsection = "model"
description = "The PRT model's Particle Release Point (PRP) package performs release point validation using a point-in-polygon test that compares raw coordinates for exact floating point equality. This could incorrectly flag points close to a cell boundary as outside the cell, especially for rotated cells or cells with very large coordinate values. Added a small tolerance to the containment check, scaled to the cell's extent, to reduce the odds that a point will fail the check due to numerical inexactness."

[[items]]
section = "fixes"
subsection = "model"
description = "The PRT model did not consistently clamp particle coordinates to the extent of the cell before applying the tracking method. This could cause an incorrect exit face or travel time solution, for example due to roundoff in the coordinate transformations computed as the particle moves between cells. This has been corrected; coordinates will now be clamped to the cell boundary in all dimensions. Results may change slightly for models with particle positions lying close to cell boundaries."

[[items]]
section = "fixes"
subsection = "model"
description = "The PRT model could encounter a floating point exception and crash while applying the tracking algorithm if any PRP package set STOPTIME prior to any of its release times. Terminate particles whose STOPTIME precedes release time immediately with status code 8 (unreleased), and show a warning."

[[items]]
section = "fixes"
subsection = "model"
description = "The PRT model previously accumulated mass for particles only from the first Particle Release Point (PRP) package, producing a budget discrepancy for any PRT model with more than one PRP package. Mass is now correctly accumulated to balance the budget."

[[items]]
section = "fixes"
subsection = "model"
description = "The PRT model could report particle coordinates incorrectly on rotated grids with quad refinement. The cumulative coordinate transformation applied by the tracking method was not correctly reversed before coordinates were reported, adding an offset that grows with the grid rotation angle (and with cell size). The overall path was not affected. Reported coordinates on affected models may change slightly."
