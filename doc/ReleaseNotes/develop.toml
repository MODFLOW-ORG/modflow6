[[items]]
section = "features"
subsection = "model"
description = "Added a new STRANDED\\_MASS option to the Mobile Storage and Transfer (MST) Package of the Groundwater Transport (GWT) Model. The mobile domain scales both the dissolved and the sorbed solute mass by the saturation of a cell, so when a cell drains the solute it held is returned to the water that remains and the simulated concentration rises. Sorbed solute does not move with the water table, because the solid phase does not drain, and when STRANDED\\_MASS is specified that mass is instead held out of the mobile domain until the cell rewets. The mass that returns when a cell rewets is the mass that the same cell gave up, so mass is conserved without reference to neighboring cells, and a cell that drains and rewets completely recovers all of it. Stranded mass decays at the rate given for the sorbed phase, and because that decay never passes through the concentration equation it is reported in a budget for the package; only the transfer between the mobile domain and the stranded mass appears in the model budget, as STORAGE-STRANDED. Stranded mass can be written to a file using the STRANDED FILEOUT option. The option applies to sorbed mass, so it has no effect unless SORPTION is also specified, and it cannot be used with the Immobile Storage and Transfer (IST) Package."
