section = "features"
subsection = "advanced"
description = "The Multi-Aquifer Well (MAW) Package now supports non-vertical (slanted or horizontal) well connections. When the NON\\_VERTICAL\\_WELLS option is specified, an ANGLEDATA block can be used to assign a tilt angle (deviation from vertical) to individual well connections. The saturated conductance for those connections is scaled by the in-cell screen length, which is calculated from the screen top, screen bottom, well radius, and tilt angle (or specified directly with an optional connection length), instead of the vertical screen thickness. A connection length must be specified for horizontal connections, and the MEAN conductance equation is recommended for horizontal connections."
